<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1512">
<title>Poker Timer</title>
<!-- Poker Blinds Timer. MIT License: free to use, copy, modify and share. See LICENSE. -->
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --text: #1b1f1d;
    --muted: #6b716d;
    --accent: #1f7a4d;
    --accent-text: #ffffff;
    --warn: #c0392b;
    --border: #d9d4c7;
    --btn: #e8e3d8;
  }
  :root[data-theme="dark"] {
    --bg: #0f1512;
    --panel: #1a221e;
    --text: #f1f4f2;
    --muted: #8f9a94;
    --accent: #2fb872;
    --accent-text: #0b120e;
    --warn: #ff5a4a;
    --border: #2b3530;
    --btn: #25302a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    user-select: none; -webkit-user-select: none;
    overflow: hidden;
    transition: background .2s, color .2s;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px;
  }
  .level-label { font-size: clamp(16px, 4vw, 26px); font-weight: 700; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  .icon-btn {
    background: var(--btn); color: var(--text); border: none; border-radius: 12px;
    width: 48px; height: 48px; font-size: 22px; cursor: pointer; margin-left: 8px;
  }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 16px; min-height: 0; text-align: center;
  }
  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    line-height: 1;
    font-size: min(30vw, 32vh);
    letter-spacing: -0.02em;
  }
  .timer.warning { color: var(--warn); }
  .timer.final { font-size: min(62vw, 42vh); }
  .timer.paused { opacity: .45; }
  .blinds-title { margin-top: 2vh; font-size: clamp(14px, 3.5vw, 22px); color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
  .blinds {
    font-variant-numeric: tabular-nums;
    font-weight: 800; line-height: 1.05;
    font-size: min(17vw, 16vh);
    color: var(--accent);
  }
  .next { margin-top: 1vh; font-size: clamp(16px, 4.5vw, 28px); color: var(--muted); font-variant-numeric: tabular-nums; }
  #awakeBtn { position: relative; opacity: .45; }
  #awakeBtn.on { opacity: 1; box-shadow: inset 0 0 0 2px var(--accent); }
  #awakeBtn.off::after {
    content: ""; position: absolute; left: 10px; right: 10px; top: 50%; height: 3px;
    background: var(--warn); transform: rotate(-35deg); border-radius: 2px;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 999px;
    font-size: 17px; font-weight: 700; white-space: nowrap; z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .toast.show { opacity: .92; }
  footer {
    display: flex; gap: 8px; padding: 12px 16px 16px;
  }
  footer button {
    flex: 1; border: none; border-radius: 16px; height: 68px; padding: 0 4px;
    font-size: clamp(13px, 3.6vw, 20px); font-weight: 700; cursor: pointer;
    background: var(--btn); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  footer button .ic { font-size: 1.4em; }
  footer button.primary { flex: 1.6; font-size: clamp(18px, 5vw, 24px); background: var(--accent); color: var(--accent-text); }
  footer button:active, .icon-btn:active { transform: scale(.97); }

  /* Expired overlay */
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.6); z-index: 20; padding: 16px;
  }
  .overlay.show { display: flex; }
  .card {
    background: var(--panel); color: var(--text); border-radius: 20px; width: 100%; max-width: 480px;
    padding: 24px; max-height: 90vh; overflow-y: auto;
  }
  .alarm-card { text-align: center; }
  .alarm-card h2 { margin: 0 0 8px; font-size: 28px; }
  .alarm-card .new-blinds { font-size: 56px; font-weight: 800; color: var(--accent); margin: 12px 0 20px; font-variant-numeric: tabular-nums; }
  .alarm-card button { width: 100%; height: 72px; font-size: 22px; font-weight: 800; border: none; border-radius: 16px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .flash { animation: flash 1s infinite; }
  @keyframes flash { 50% { background: rgba(192,57,43,.75); } }

  /* Settings */
  .card h2 { margin: 0 0 16px; font-size: 24px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 700; margin-bottom: 6px; }
  .field .hint { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .field input[type=number] {
    width: 100%; height: 52px; font-size: 22px; padding: 0 12px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--bg); color: var(--text);
  }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .check { display: flex; align-items: center; gap: 12px; font-weight: 700; cursor: pointer; }
  .check input { width: 28px; height: 28px; accent-color: var(--accent); }
  .preview { font-size: 15px; color: var(--muted); line-height: 1.5; font-variant-numeric: tabular-nums; }
  .sound-row { display: flex; gap: 10px; }
  .sound-row select {
    flex: 1; min-width: 0; height: 52px; font-size: 20px; padding: 0 12px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--bg); color: var(--text);
  }
  .sound-row button {
    flex: 0 0 64px; width: 64px; height: 52px; border: none; border-radius: 12px; font-size: 22px; cursor: pointer;
    background: var(--accent); color: var(--accent-text);
  }
  .card-actions { display: flex; gap: 10px; margin-top: 8px; }
  .card-actions button { flex: 1; height: 56px; border: none; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; background: var(--btn); color: var(--text); }
  .card-actions button.primary { background: var(--accent); color: var(--accent-text); }

  /* Landscape: side-by-side */
  @media (orientation: landscape) and (max-height: 600px) {
    main { flex-direction: row; gap: 5vw; }
    .timer { font-size: min(22vw, 42vh); }
    .timer.final { font-size: min(36vw, 62vh); }
    .blinds { font-size: min(12vw, 24vh); }
    .blinds-wrap { text-align: left; }
    footer button { height: 56px; }
  }
</style>
</head>
<body>
  <header>
    <div class="level-label" id="levelLabel">Level 1</div>
    <div>
      <button class="icon-btn" id="awakeBtn" aria-label="Keep screen awake" aria-pressed="false">💡</button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light/dark mode">🌙</button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main>
    <div class="timer paused" id="timer">15:00</div>
    <div class="blinds-wrap">
      <div class="blinds-title">Blinds</div>
      <div class="blinds" id="blinds">1 / 2</div>
      <div class="next" id="next">Next: 2 / 4</div>
    </div>
  </main>

  <footer>
    <button id="backBtn" aria-label="Previous level"><span class="ic">⏮</span>Back</button>
    <button id="restartBtn" aria-label="Restart this level"><span class="ic">↺</span>Restart</button>
    <button id="startBtn" class="primary">Start</button>
    <button id="skipBtn" aria-label="Next level"><span class="ic">⏭</span>Skip</button>
  </footer>

  <div class="toast" id="toast"></div>

  <!-- Level-over alarm -->
  <div class="overlay flash" id="alarmOverlay">
    <div class="card alarm-card">
      <h2>Time's up!</h2>
      <div id="alarmLevel">Level 2</div>
      <div class="new-blinds" id="alarmBlinds">2 / 4</div>
      <button id="nextLevelBtn">OK</button>
    </div>
  </div>

  <!-- Settings -->
  <div class="overlay" id="settingsOverlay">
    <div class="card">
      <h2>Settings</h2>
      <div class="field">
        <label for="minutes">Minutes per level</label>
        <input type="number" id="minutes" min="1" max="180" inputmode="numeric">
      </div>
      <div class="row">
        <div class="field">
          <label for="small">Little blind</label>
          <input type="number" id="small" min="1" inputmode="numeric">
        </div>
        <div class="field">
          <label>Big blind</label>
          <input type="number" id="big" disabled>
        </div>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="clean"> Clean blind escalation</label>
        <div class="hint">Steps ×1, ×2, ×5, ×10, then doubles (1/2 → 2/4 → 5/10 → 10/20…). Off: the little blind simply doubles each level.</div>
      </div>
      <div class="field">
        <label for="alarmSound">Alarm sound</label>
        <div class="sound-row">
          <select id="alarmSound">
            <option value="classic">Classic beep</option>
            <option value="bell">Bell / chime</option>
            <option value="siren">Siren</option>
            <option value="casino">Casino ding</option>
            <option value="buzzer">Buzzer</option>
            <option value="country">Country twang (“Blinds Up”)</option>
            <option value="lounge">Vegas lounge (“High Roller”)</option>
            <option value="cow">Cow moo</option>
          </select>
          <button type="button" id="previewSound" aria-label="Preview alarm sound">▶</button>
        </div>
      </div>
      <div class="field">
        <label>Preview</label>
        <div class="preview" id="preview"></div>
      </div>
      <div class="card-actions">
        <button id="cancelSettings">Cancel</button>
        <button id="saveSettings" class="primary">Save</button>
      </div>
    </div>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---------- Persistent settings ----------
  const defaults = { minutes: 15, small: 1, clean: true, theme: null, alarmSound: 'classic', keepAwake: true };
  function load() {
    try { return Object.assign({}, defaults, JSON.parse(localStorage.getItem('pokerTimer') || '{}')); }
    catch (e) { return Object.assign({}, defaults); }
  }
  function save() {
    try { localStorage.setItem('pokerTimer', JSON.stringify(settings)); } catch (e) {}
  }
  const settings = load();

  // ---------- Theme ----------
  function applyTheme() {
    const theme = settings.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = theme;
    $('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
    document.querySelector('meta[name=theme-color]').content = theme === 'dark' ? '#0f1512' : '#f4f1ea';
  }
  $('themeBtn').onclick = () => {
    settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    save(); applyTheme();
  };
  applyTheme();

  // ---------- Blind math ----------
  function multiplier(level, clean) {
    if (!clean) return Math.pow(2, level);
    const ladder = [1, 2, 5, 10];
    return level < ladder.length ? ladder[level] : 10 * Math.pow(2, level - 3);
  }
  function blindsFor(level, small = settings.small, clean = settings.clean) {
    const s = small * multiplier(level, clean);
    return [s, s * 2];
  }
  const fmt = n => n.toLocaleString();
  const fmtBlinds = l => { const [s, b] = blindsFor(l); return `${fmt(s)} / ${fmt(b)}`; };

  // ---------- Timer state ----------
  let level = 0;
  let remaining = settings.minutes * 60 * 1000; // ms
  let endTime = null;   // set while running
  let warned = false;
  let tickHandle = null;

  const running = () => endTime !== null;

  function render() {
    const ms = running() ? Math.max(0, endTime - Date.now()) : remaining;
    const total = Math.ceil(ms / 1000);
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    const finalMinute = total <= 60;
    $('timer').textContent = finalMinute ? String(total)
                           : h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
                               : `${m}:${String(s).padStart(2,'0')}`;
    $('timer').classList.toggle('final', finalMinute);
    $('timer').classList.toggle('warning', total <= 60 && total > 0 && settings.minutes > 1);
    $('timer').classList.toggle('paused', !running());
    $('levelLabel').textContent = `Level ${level + 1}`;
    $('blinds').textContent = fmtBlinds(level);
    $('next').textContent = `Next: ${fmtBlinds(level + 1)}`;
    $('startBtn').textContent = running() ? 'Pause' : (remaining < settings.minutes * 60000 ? 'Resume' : 'Start');
    $('backBtn').disabled = level === 0;
    $('backBtn').style.opacity = level === 0 ? .4 : 1;
  }

  function tick() {
    if (!running()) return;
    const left = endTime - Date.now();
    if (!warned && left <= 60000 && settings.minutes > 1) { warned = true; warningBeep(); }
    if (left <= 0) { expire(); return; }
    render();
  }

  function start() {
    unlockAudio();
    endTime = Date.now() + remaining;
    clearInterval(tickHandle);
    tickHandle = setInterval(tick, 200);
    requestWakeLock();
    render();
  }
  function pause() {
    remaining = Math.max(0, endTime - Date.now());
    endTime = null;
    clearInterval(tickHandle);
    render();
  }
  function resetLevelClock() {
    endTime = null; clearInterval(tickHandle);
    remaining = settings.minutes * 60000;
    warned = false;
  }
  function expire() {
    resetLevelClock();
    level++;
    render();
    $('alarmLevel').textContent = `Level ${level + 1}`;
    $('alarmBlinds').textContent = fmtBlinds(level);
    $('alarmOverlay').classList.add('show');
    startAlarm();
  }

  $('startBtn').onclick = () => running() ? pause() : start();
  $('restartBtn').onclick = () => { resetLevelClock(); render(); };
  $('skipBtn').onclick = () => { resetLevelClock(); level++; render(); };
  $('backBtn').onclick = () => { if (level > 0) { resetLevelClock(); level--; render(); } };
  $('nextLevelBtn').onclick = () => {
    stopAlarm();
    $('alarmOverlay').classList.remove('show');
    render();
  };

  // ---------- Audio ----------
  let ctx = null;
  function unlockAudio() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    // Play a silent blip so iOS fully unlocks audio on this user gesture
    if (ctx) tone(0, 0.05, 440, 0.0001);
  }
  function tone(when, dur, freq, vol = 0.5, type = 'square') {
    if (!ctx) return;
    const t = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.setValueAtTime(vol, t + dur - 0.02);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function vibrate(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }

  function warningBeep() {
    tone(0, 0.15, 880, 0.35, 'sine');
    tone(0.25, 0.15, 880, 0.35, 'sine');
    vibrate([150, 100, 150]);
  }

  let alarmHandle = null, alarmStopAt = 0;

  // Generic voice: oscillator with optional pitch sweep and a percussive or held envelope
  function voice({ at = 0, dur, freq, freqEnd = null, type = 'sine', vol = 0.4, decay = false }) {
    if (!ctx) return;
    const t = ctx.currentTime + at;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (freqEnd) o.frequency.linearRampToValueAtTime(freqEnd, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.005);
    if (decay) {
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    } else {
      g.gain.setValueAtTime(vol, t + dur - 0.03);
      g.gain.linearRampToValueAtTime(0, t + dur);
    }
    o.connect(g).connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }

  // Each sound plays one ~1.5 s burst; the alarm repeats it every 1.8 s
  const sounds = {
    classic() {
      for (let i = 0; i < 4; i++) {
        tone(i * 0.25, 0.18, 1047, 0.5);
        tone(i * 0.25 + 0.09, 0.09, 1319, 0.4);
      }
    },
    bell() {
      // Two strikes; inharmonic partials give a bell-like ring
      [0, 0.8].forEach(at => {
        [[1, 0.45], [2.76, 0.2], [5.4, 0.12], [8.93, 0.06]].forEach(([mult, v]) =>
          voice({ at, dur: 1.6, freq: 660 * mult, vol: v, decay: true }));
      });
    },
    siren() {
      voice({ at: 0,   dur: 0.8, freq: 600,  freqEnd: 1300, type: 'sawtooth', vol: 0.3 });
      voice({ at: 0.8, dur: 0.8, freq: 1300, freqEnd: 600,  type: 'sawtooth', vol: 0.3 });
    },
    casino() {
      const notes = [1319, 1568, 2093, 2637];
      for (let r = 0; r < 2; r++) {
        notes.forEach((f, i) => {
          const at = r * 0.7 + i * 0.1;
          voice({ at, dur: 0.45, freq: f, type: 'triangle', vol: 0.4, decay: true });
          voice({ at, dur: 0.3, freq: f * 2, type: 'sine', vol: 0.12, decay: true });
        });
      }
    },
    buzzer() {
      [0, 0.8].forEach(at => {
        voice({ at, dur: 0.65, freq: 110, type: 'sawtooth', vol: 0.35 });
        voice({ at, dur: 0.65, freq: 117, type: 'square', vol: 0.2 });
      });
    },
    country() {
      // Original "Blinds Up" jingle in G: banjo-style plucks over a boom-chick bass
      const N = { G2: 98, D2: 73.42, C3: 130.81, G3: 196, B3: 246.94, D4: 293.66,
                  E4: 329.63, G4: 392, A4: 440, B4: 493.88, D5: 587.33, E5: 659.25, G5: 783.99 };
      const e = 0.15; // eighth note
      const melody = [
        ['D5',0,1,true], ['E5',1,1], ['G5',2,1], ['E5',3,1], ['D5',4,2],
        ['B4',6,1], ['D5',7,1], ['E5',8,1,true], ['D5',9,1], ['B4',10,1], ['A4',11,1],
        ['G4',12,4,true]
      ];
      melody.forEach(([n, beat, len, slide]) =>
        pluck({ at: beat * e, dur: len * e + 0.25, freq: N[n], vol: 0.32, slide }));
      // Boom-chick: bass note, then a quick strum
      const bass = [['G2',0], ['D2',2], ['G2',4], ['D2',6], ['C3',8], ['D2',10], ['G2',12]];
      bass.forEach(([n, beat]) => voice({ at: beat * e, dur: 0.28, freq: N[n], type: 'triangle', vol: 0.4, decay: true }));
      [1, 3, 5, 7, 9, 11].forEach(beat =>
        ['G3','B3','D4'].forEach((n, i) => pluck({ at: beat * e + i * 0.012, dur: 0.12, freq: N[n], vol: 0.08 })));
    },
    lounge() {
      // Original "High Roller" lounge jingle: swung electric piano over walking bass and brushed hi-hat
      const q = 0.36;                 // quarter note
      const b = x => x * q;           // beat -> seconds (swung eighths written as .67)
      const chords = [
        [0,   1.4, [261.63, 329.63, 392.00, 493.88]], // Cmaj7
        [1.67,0.3, [261.63, 329.63, 392.00, 493.88]],
        [2,   1.4, [196.00, 277.18, 329.63, 392.00]], // A7
        [3.67,0.3, [196.00, 277.18, 329.63, 392.00]],
        [4,   1.4, [174.61, 220.00, 261.63, 329.63]], // Dm9
        [5.67,0.3, [174.61, 220.00, 261.63, 329.63]],
        [6,   0.7, [174.61, 246.94, 329.63]],         // G13
        [7,   1.6, [164.81, 246.94, 293.66, 392.00]]  // Cmaj9 (final)
      ];
      chords.forEach(([at, dur, notes]) =>
        notes.forEach(f => epiano({ at: b(at), dur, freq: f, vol: 0.07 })));
      const melody = [
        [0, .3, 659.25], [.67, .2, 783.99], [1, .6, 987.77],
        [2, .2, 880.00], [2.67, .2, 783.99], [3, .6, 659.25],
        [4, .2, 698.46], [4.67, .2, 659.25], [5, .7, 587.33],
        [6, .2, 493.88], [6.67, .2, 587.33], [7, 1.4, 659.25]
      ];
      melody.forEach(([at, dur, f]) => epiano({ at: b(at), dur: dur + 0.25, freq: f, vol: 0.2, bright: true }));
      const bass = [130.81, 164.81, 110.00, 138.59, 146.83, 174.61, 98.00, 130.81];
      bass.forEach((f, i) => {
        voice({ at: b(i), dur: i === 7 ? 1.2 : q * 0.95, freq: f, type: 'sine', vol: 0.35, decay: true });
        voice({ at: b(i), dur: q * 0.6, freq: f * 2, type: 'triangle', vol: 0.08, decay: true });
      });
      [1, 1.67, 3, 3.67, 5, 5.67].forEach(at => hat(b(at), at % 1 ? 0.04 : 0.07));
    },
    cow() {
      // One long "mooooo": a buzzy low voice whose pitch rises then sags,
      // shaped by a filter that opens from a closed-mouth "mm" to an open "ooo"
      if (!ctx) return;
      const t = ctx.currentTime, len = 1.8;

  let wakeLock = null, sleepVideo = null, awake = false, acquiring = false;

  function updateAwakeUI() {
    const btn = $('awakeBtn');
    btn.classList.toggle('on', settings.keepAwake && awake);
    btn.classList.toggle('off', !settings.keepAwake);
    btn.setAttribute('aria-pressed', String(settings.keepAwake));
  }
  function makeSleepVideo() {
    const v = document.createElement('video');
    v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.muted = true;
    v.setAttribute('title', 'Keep screen awake');
    v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0;';
    [['webm', NOSLEEP_WEBM], ['mp4', NOSLEEP_MP4]].forEach(([type, src]) => {

      if (v.duration <= 1) v.setAttribute('loop', '');
      else v.addEventListener('timeupdate', () => { if (v.currentTime > 0.5) v.currentTime = Math.random(); });

    document.body.appendChild(v);
    return v;

        if (!sleepVideo) sleepVideo = makeSleepVideo();

      } catch (e) { awake = false; }

      acquiring = false;
      updateAwakeUI();
    }

    updateAwakeUI();
  }

  function updatePreview() {

    const clean = $('clean').checked;
    $('big').value = small * 2;
    const items = [];
    for (let i = 0; i < 8; i++) {

      items.push(`${fmt(s)}/${fmt(b)}`);
    }
    $('preview').textContent = items.join(' → ') + ' …';
  }

    $('clean').checked = settings.clean;

  $('small').oninput = updatePreview;

    const before = [settings.minutes, settings.small, settings.clean].join();
    settings.minutes = Math.min(180, Math.max(1, parseInt($('minutes').value) || 15));
    settings.small = Math.max(1, parseInt($('small').value) || 1);
